name: Release macOS installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
